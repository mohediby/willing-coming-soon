<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title></title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  width: 100vw;
  height: 100vh;
}

/* Background layer */
.video-background {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  filter: blur(24px);
  transform: scale(1.08);
  opacity: 0.45;
}

/* Main video */
.video-main {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
}

/* Desktop and laptop */
@media (min-width: 1025px) {
  .video-main {
    object-fit: cover;
  }
}

/* Tablets */
@media (min-width: 601px) and (max-width: 1024px) {
  .video-main {
    object-fit: contain;
  }
}

/* Mobile */
@media (max-width: 600px) {
  .video-main {
    object-fit: contain;
  }

  .video-background {
    filter: blur(20px);
    transform: scale(1.06);
  }
}
</style>
</head>

<body>

<video
  class="video-background"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
  aria-hidden="true"
>
  <source src="background.mp4" type="video/mp4">
</video>

<video
  class="video-main"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
>
  <source src="background.mp4" type="video/mp4">
</video>

</body>
</html>

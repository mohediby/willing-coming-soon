<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Willing Investments</title>

<style>
*{ box-sizing:border-box; }

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

body{ font-family:Arial,Helvetica,sans-serif; }

.video-bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  height:100dvh;
  object-fit:cover;
  object-position:center;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.22);
  pointer-events:none;
}

.brand{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#f2f2f2;
  font-size:clamp(22px,3vw,46px);
  letter-spacing:.24em;
  white-space:nowrap;
  text-align:center;
  text-shadow:0 2px 18px rgba(0,0,0,.5);
}

@media(max-width:600px){
  .brand{ font-size:22px; letter-spacing:.16em; }
}
</style>
</head>

<body>

<video id="bg" class="video-bg" autoplay muted loop playsinline preload="auto">
  <source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<div class="brand">WILLING INVESTMENTS</div>

<script>
var v = document.getElementById('bg');
v.muted = true;
function tryPlay(){ var p = v.play(); if (p && p.catch) p.catch(function(){}); }
tryPlay();
document.addEventListener('touchstart', tryPlay, { once:true, passive:true });
document.addEventListener('click', tryPlay, { once:true });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Willing Investments</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* Full-screen background layer */
.video-background {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  filter: blur(24px);
  transform: scale(1.08);
  opacity: 0.45;
}

/* Main video */
.video-main {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
}

/* Dark overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.22);
  pointer-events: none;
}

/* Brand */
.brand {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);

  color: #f2f2f2;
  font-size: clamp(22px, 3vw, 46px);
  font-weight: 400;
  letter-spacing: 0.24em;
  line-height: 1;
  white-space: nowrap;
  text-align: center;

  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);

  pointer-events: none;
  z-index: 10;
}

/* Phones */
@media (max-width: 600px) {
  .brand {
    font-size: 22px;
    letter-spacing: 0.16em;
  }

  .video-background {
    filter: blur(20px);
    transform: scale(1.06);
  }

  .video-main {
    object-fit: contain;
  }
}

/* Tablets */
@media (min-width: 601px) and (max-width: 1024px) {
  .video-main {
    object-fit: contain;
  }
}

/* Desktop / Laptop */
@media (min-width: 1025px) {
  .video-main {
    object-fit: cover;
  }
}
</style>
</head>

<body>

<video
  class="video-background"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
  aria-hidden="true"
>
  <source src="background.mp4" type="video/mp4">
</video>

<video
  class="video-main"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
>
  <source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="brand">
  Willing Investments
</div>

</body>
</html>

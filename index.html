<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title></title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  width: 100%;
  min-height: 100vh;
}

/* Full-screen video */
.video-main {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  width: 100vw;
  height: 100dvh;
  object-fit: cover;
  object-position: center center;
  display: block;
}

/* iPhone / iPad / Android */
@media (max-width: 1024px) {
  .video-main {
    width: 100vw;
    height: 100dvh;
    object-fit: cover;
    object-position: center center;
  }
}

/* Laptop / Desktop */
@media (min-width: 1025px) {
  .video-main {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center center;
  }
}
</style>
</head>

<body>

<video
  class="video-main"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
>
  <source src="background.mp4" type="video/mp4">
</video>

</body>
</html>
